<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>為什麼主要指標會飽和</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; height: auto; max-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Stacked bar · SplitSense</p>
    <h1>為什麼主要指標會飽和</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metric-saturation-title metric-saturation-desc">
        <title id="metric-saturation-title">為什麼主要指標會飽和</title>
        <desc id="metric-saturation-desc">比例圖：測試集 4,741 題中，1,588 題（33.5%）可見標註已不一致、必然有分歧，其餘 3,153 題可見一致。10% 預算的 474 個名額完全落在前者，所以任何方法的 Precision 都是 100%。</desc>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <rect x="80" y="176" width="295" height="88" fill="rgba(237,155,38,0.12)"/>
        <rect x="375" y="176" width="585" height="88" fill="rgba(27,79,156,0.10)"/>
        <rect x="80" y="176" width="880" height="88" fill="none" stroke="rgba(38,46,61,0.25)" stroke-width="1"/>
        <line x1="375" y1="176" x2="375" y2="264" stroke="#c7641a" stroke-width="1.5"/>
        <text x="227" y="212" text-anchor="middle" class="h ink">可見已不一致</text>
        <text x="227" y="232" text-anchor="middle" class="sub mono acc">1,588 · 33.5% · 100% 分歧</text>
        <text x="667" y="212" text-anchor="middle" class="h ink">可見一致（難題組）</text>
        <text x="667" y="232" text-anchor="middle" class="sub mono navy">3,153 · 66.5% · 24.7% 分歧</text>
        <path d="M80 148 V136 H168 V148" fill="none" stroke="#1b4f9c" stroke-width="1.5"/>
        <rect x="72" y="108" width="160" height="16" rx="2" fill="#ffffff"/>
        <text x="80" y="120" class="sub mono navy">預算 10% · K=474</text>
        <path d="M375 264 V280" stroke="#c7641a" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="375" y="296" text-anchor="middle" class="sub mono acc">33.5%</text>
        <text x="375" y="312" text-anchor="middle" class="lg muted">預算要超過這裡，Precision 才會開始下降</text>
        <rect x="80" y="340" width="880" height="72" rx="6" fill="#ffffff" stroke="rgba(38,46,61,0.12)" stroke-width="1"/>
        <text x="104" y="372" class="h ink">確定會吵的有 1,588 題，10% 預算的名額只有 474 個。</text>
        <text x="104" y="394" class="q muted">所以任何方法只要把這批排前面，Precision@10% 都是 100%、Recall@10% 都卡在上限 20.1%——指標分不出模型好壞。</text>
        <line x1="32" y1="452" x2="968" y2="452" stroke="rgba(38,46,61,0.12)" stroke-width="0.8"/>
        <text x="32" y="476" letter-spacing="0.14em" class="val mono muted">LEGEND</text>
        <rect x="128" y="466" width="16" height="10" rx="2" fill="rgba(237,155,38,0.12)" stroke="#c7641a" stroke-width="1"/>
        <text x="152" y="476" class="lg muted">必然分歧，不需要模型</text>
        <rect x="344" y="466" width="16" height="10" rx="2" fill="rgba(27,79,156,0.12)" stroke="#1b4f9c" stroke-width="1"/>
        <text x="368" y="476" class="lg muted">模型真正要解的那批</text>
        <text x="968" y="476" text-anchor="end" class="val mono muted">test split 4,741 題</text>
      </svg>
    </div>
  </div>
</body>
</html>
