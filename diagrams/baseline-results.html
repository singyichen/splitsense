<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>只複核 10% 時能抓到多少爭議題</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; height: auto; max-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar chart · SplitSense</p>
    <h1>只複核 10% 時能抓到多少爭議題</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baseline-results-title baseline-results-desc">
        <title id="baseline-results-title">只複核 10% 時能抓到多少爭議題</title>
        <desc id="baseline-results-desc">長條圖：難題組上五個方法的 Recall@10%。隨機 9.5、可見 entropy 9.9、同意標籤查表 18.5、Logistic Regression 19.4、Gradient Boosting 19.4，理論上限 40.5%。</desc>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(38,46,61,0.25)" stroke-width="1"/>
        <text x="72" y="423" text-anchor="end" class="val mono muted">0%</text>
        <line x1="80" y1="344" x2="960" y2="344" stroke="rgba(38,46,61,0.08)" stroke-width="0.8"/>
        <text x="72" y="347" text-anchor="end" class="val mono muted">10%</text>
        <line x1="80" y1="268" x2="960" y2="268" stroke="rgba(38,46,61,0.08)" stroke-width="0.8"/>
        <text x="72" y="271" text-anchor="end" class="val mono muted">20%</text>
        <line x1="80" y1="192" x2="960" y2="192" stroke="rgba(38,46,61,0.08)" stroke-width="0.8"/>
        <text x="72" y="195" text-anchor="end" class="val mono muted">30%</text>
        <line x1="80" y1="116" x2="960" y2="116" stroke="rgba(38,46,61,0.08)" stroke-width="0.8"/>
        <text x="72" y="119" text-anchor="end" class="val mono muted">40%</text>
        <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(38,46,61,0.25)" stroke-width="1"/>
        <line x1="80" y1="112" x2="960" y2="112" stroke="#6c798e" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="760" y="92" width="196" height="14" rx="2" fill="#ffffff"/>
        <text x="956" y="103" text-anchor="end" class="val mono muted">理論上限 40.5%</text>
        <rect x="112" y="348" width="112" height="72" fill="#ffffff"/>
        <rect x="112" y="348" width="112" height="72" fill="rgba(79,91,110,0.15)" stroke="#6c798e" stroke-width="1"/>
        <text x="168" y="340" text-anchor="middle" class="val mono muted">9.5</text>
        <text x="168" y="444" text-anchor="middle" class="h2 ink">隨機排序</text>
        <text x="168" y="460" text-anchor="middle" class="val mono muted">1.0×</text>
        <rect x="288" y="345" width="112" height="75" fill="#ffffff"/>
        <rect x="288" y="345" width="112" height="75" fill="rgba(79,91,110,0.15)" stroke="#6c798e" stroke-width="1"/>
        <text x="344" y="337" text-anchor="middle" class="val mono muted">9.9</text>
        <text x="344" y="444" text-anchor="middle" class="h2 ink">可見 entropy</text>
        <text x="344" y="460" text-anchor="middle" class="val mono muted">1.0×</text>
        <rect x="464" y="279" width="112" height="141" fill="#ffffff"/>
        <rect x="464" y="279" width="112" height="141" fill="rgba(237,155,38,0.12)" stroke="#c7641a" stroke-width="1"/>
        <text x="520" y="271" text-anchor="middle" class="val mono acc">18.5</text>
        <text x="520" y="444" text-anchor="middle" class="h2 ink">同意標籤查表</text>
        <text x="520" y="460" text-anchor="middle" class="val mono muted">1.9×</text>
        <rect x="640" y="273" width="112" height="147" fill="#ffffff"/>
        <rect x="640" y="273" width="112" height="147" fill="rgba(79,91,110,0.15)" stroke="#6c798e" stroke-width="1"/>
        <text x="696" y="265" text-anchor="middle" class="val mono muted">19.4</text>
        <text x="696" y="444" text-anchor="middle" class="h2 ink">Logistic Reg.</text>
        <text x="696" y="460" text-anchor="middle" class="val mono muted">1.9×</text>
        <rect x="816" y="273" width="112" height="147" fill="#ffffff"/>
        <rect x="816" y="273" width="112" height="147" fill="rgba(79,91,110,0.15)" stroke="#6c798e" stroke-width="1"/>
        <text x="872" y="265" text-anchor="middle" class="val mono muted">19.4</text>
        <text x="872" y="444" text-anchor="middle" class="h2 ink">Gradient Boost.</text>
        <text x="872" y="460" text-anchor="middle" class="val mono muted">1.9×</text>
        <line x1="32" y1="488" x2="968" y2="488" stroke="rgba(38,46,61,0.12)" stroke-width="0.8"/>
        <text x="32" y="512" letter-spacing="0.14em" class="val mono muted">LEGEND</text>
        <rect x="128" y="502" width="16" height="10" rx="2" fill="rgba(237,155,38,0.12)" stroke="#c7641a" stroke-width="1"/>
        <text x="152" y="512" class="lg muted">不用訓練的透明規則</text>
        <text x="968" y="512" text-anchor="end" class="val mono muted">y 軸：Recall@10%，難題組 3,153 題</text>
      </svg>
    </div>
  </div>
</body>
</html>
