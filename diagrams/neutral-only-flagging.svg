<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="neutral-only-flagging-title neutral-only-flagging-desc" id="neutral-only-flagging-root">
        <title id="neutral-only-flagging-title">模型在操作點上只做一件事</title>
        <desc id="neutral-only-flagging-desc">分組長條圖：依前兩人同意的標籤分成四組。真實分歧率分別是 46.5%、29.3%、20.8%、12.3%，而模型送複核的比例只有 neutral 組是 36.5%，其餘三組皆為零。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #neutral-only-flagging-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #neutral-only-flagging-root { font-family: var(--font-sans); color: var(--color-ink); }
      #neutral-only-flagging-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#neutral-only-flagging-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>
