        <line x1="80" y1="344" x2="960" y2="344" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="347" fill="#4f5b6e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">10%</text>
        <line x1="80" y1="268" x2="960" y2="268" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
