<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="neutral-only-flagging-title neutral-only-flagging-desc" id="neutral-only-flagging-root">
        <title id="neutral-only-flagging-title">模型在操作點上只做一件事</title>
        <desc id="neutral-only-flagging-desc">分組長條圖：依前兩人同意的標籤分成四組。真實分歧率分別是 46.5%、29.3%、20.8%、12.3%，而模型送複核的比例只有 neutral 組是 36.5%，其餘三組皆為零。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #neutral-only-flagging-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #neutral-only-flagging-root { font-family: var(--font-sans); color: var(--color-ink); }
      #neutral-only-flagging-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#neutral-only-flagging-root .diagram-container { overflow-x: visible; }
}
      #neutral-only-flagging-root text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #neutral-only-flagging-root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #neutral-only-flagging-root .h { font-size: 12px; font-weight: 700; }
      #neutral-only-flagging-root .h2 { font-size: 11px; font-weight: 700; }
      #neutral-only-flagging-root .q { font-size: 11px; }
      #neutral-only-flagging-root .n9 { font-size: 9px; }
      #neutral-only-flagging-root .lg { font-size: 8px; }
      #neutral-only-flagging-root .sub { font-size: 9px; }
      #neutral-only-flagging-root .val { font-size: 8px; }
      #neutral-only-flagging-root .chip { font-size: 7px; }
      #neutral-only-flagging-root .ink { fill: #262e3d; }
      #neutral-only-flagging-root .muted { fill: #4f5b6e; }
      #neutral-only-flagging-root .navy { fill: #1b4f9c; }
      #neutral-only-flagging-root .acc { fill: #a04f15; }
      #neutral-only-flagging-root .inv { fill: #ffffff; }
      #neutral-only-flagging-root .pale { fill: #d6e4f5; }</style>
  </defs>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <line x1="80" y1="420" x2="960" y2="420" stroke="#262e3d" stroke-width="1" stroke-opacity="0.25"/>
        <text x="72" y="423" text-anchor="end" class="val mono muted">0%</text>
        <line x1="80" y1="344" x2="960" y2="344" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="347" text-anchor="end" class="val mono muted">10%</text>
        <line x1="80" y1="268" x2="960" y2="268" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="271" text-anchor="end" class="val mono muted">20%</text>
        <line x1="80" y1="192" x2="960" y2="192" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="195" text-anchor="end" class="val mono muted">30%</text>
        <line x1="80" y1="116" x2="960" y2="116" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="119" text-anchor="end" class="val mono muted">40%</text>
        <line x1="80" y1="40" x2="960" y2="40" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="43" text-anchor="end" class="val mono muted">50%</text>
        <line x1="80" y1="40" x2="80" y2="420" stroke="#262e3d" stroke-width="1" stroke-opacity="0.25"/>
        <rect x="110" y="67" width="72" height="353" fill="#ffffff"/>
        <rect x="110" y="67" width="72" height="353" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="146" y="59" text-anchor="middle" class="val mono muted">46.5</text>
        <rect x="198" y="143" width="72" height="277" fill="#ffffff"/>
        <rect x="198" y="143" width="72" height="277" fill="#1b4f9c" stroke="#1b4f9c" stroke-width="1" fill-opacity="0.12"/>
        <text x="234" y="135" text-anchor="middle" class="val mono navy">36.5</text>
        <text x="190" y="444" text-anchor="middle" class="h2 ink">neutral</text>
        <text x="190" y="460" text-anchor="middle" class="val mono navy">送出精確率 48.1%</text>
        <rect x="330" y="197" width="72" height="223" fill="#ffffff"/>
        <rect x="330" y="197" width="72" height="223" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="366" y="189" text-anchor="middle" class="val mono muted">29.3</text>
        <text x="454" y="412" text-anchor="middle" class="val mono navy">0</text>
        <text x="410" y="444" text-anchor="middle" class="h2 ink">ambiguous</text>
        <rect x="550" y="262" width="72" height="158" fill="#ffffff"/>
        <rect x="550" y="262" width="72" height="158" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="586" y="254" text-anchor="middle" class="val mono muted">20.8</text>
        <text x="674" y="412" text-anchor="middle" class="val mono navy">0</text>
        <text x="630" y="444" text-anchor="middle" class="h2 ink">negative</text>
        <rect x="770" y="327" width="72" height="93" fill="#ffffff"/>
        <rect x="770" y="327" width="72" height="93" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="806" y="319" text-anchor="middle" class="val mono muted">12.3</text>
        <text x="894" y="412" text-anchor="middle" class="val mono navy">0</text>
        <text x="850" y="444" text-anchor="middle" class="h2 ink">positive</text>
        <line x1="32" y1="488" x2="968" y2="488" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="32" y="512" letter-spacing="0.14em" class="val mono muted">LEGEND</text>
        <rect x="128" y="502" width="16" height="10" rx="2" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="152" y="512" class="lg muted">該組真實分歧率</text>
        <rect x="312" y="502" width="16" height="10" rx="2" fill="#1b4f9c" stroke="#1b4f9c" stroke-width="1" fill-opacity="0.12"/>
        <text x="336" y="512" class="lg muted">模型送複核的比例</text>
        <text x="968" y="512" text-anchor="end" class="val mono muted">x 軸：前兩人同意的標籤</text>
      </svg>
