<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baseline-results-title baseline-results-desc" id="baseline-results-root">
        <title id="baseline-results-title">只複核 10% 時能抓到多少爭議題</title>
        <desc id="baseline-results-desc">長條圖：難題組上五個方法的 Recall@10%。隨機 9.5、可見 entropy 9.9、同意標籤查表 18.5、Logistic Regression 19.4、Gradient Boosting 19.4，理論上限 40.5%。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #baseline-results-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #baseline-results-root { font-family: var(--font-sans); color: var(--color-ink); }
      #baseline-results-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#baseline-results-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>
