<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="annotation-reveal-setup-title annotation-reveal-setup-desc" id="annotation-reveal-setup-root">
        <title id="annotation-reveal-setup-title">模型看得到什麼、看不到什麼</title>
        <desc id="annotation-reveal-setup-desc">示意圖：一則留言發給三位標註者，前兩位都標 neutral、第三位標 positive。模型只看得到前兩份，第三份藏起來只用來計算答案。</desc>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #annotation-reveal-setup-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #annotation-reveal-setup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #annotation-reveal-setup-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#annotation-reveal-setup-root .diagram-container { overflow-x: visible; }
}
      #annotation-reveal-setup-root text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #annotation-reveal-setup-root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #annotation-reveal-setup-root .h { font-size: 12px; font-weight: 700; }
      #annotation-reveal-setup-root .h2 { font-size: 11px; font-weight: 700; }
      #annotation-reveal-setup-root .q { font-size: 11px; }
      #annotation-reveal-setup-root .n9 { font-size: 9px; }
      #annotation-reveal-setup-root .lg { font-size: 8px; }
      #annotation-reveal-setup-root .sub { font-size: 9px; }
      #annotation-reveal-setup-root .val { font-size: 8px; }
      #annotation-reveal-setup-root .chip { font-size: 7px; }
      #annotation-reveal-setup-root .ink { fill: #262e3d; }
      #annotation-reveal-setup-root .muted { fill: #4f5b6e; }
      #annotation-reveal-setup-root .navy { fill: #1b4f9c; }
      #annotation-reveal-setup-root .acc { fill: #a04f15; }
      #annotation-reveal-setup-root .inv { fill: #ffffff; }
      #annotation-reveal-setup-root .pale { fill: #d6e4f5; }</style>
          <marker id="annotation-reveal-setup-a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6c798e"/>
          </marker>
        </defs>
        <rect x="360" y="32" width="280" height="48" rx="6" fill="#ffffff" stroke="#262e3d" stroke-width="1"/>
        <text x="500" y="52" text-anchor="middle" class="h ink">一則 Reddit 留言</text>
        <text x="500" y="68" text-anchor="middle" class="sub mono muted">發給 3 個人標情緒</text>
        <path d="M500 80 V104" stroke="#6c798e" stroke-width="1.2" fill="none"/>
        <path d="M240 104 H760" stroke="#6c798e" stroke-width="1.2" fill="none"/>
        <path d="M240 104 V124" stroke="#6c798e" stroke-width="1.2" fill="none"/>
        <path d="M440 104 V124" stroke="#6c798e" stroke-width="1.2" fill="none"/>
        <path d="M760 104 V124" stroke="#6c798e" stroke-width="1.2" fill="none"/>
        <circle cx="240" cy="156" r="28" fill="#1b4f9c" stroke="#1b4f9c" stroke-width="1.5" fill-opacity="0.10"/>
        <text x="240" y="161" text-anchor="middle" class="h ink">A</text>
        <text x="240" y="204" text-anchor="middle" class="h2 ink">neutral</text>
        <circle cx="440" cy="156" r="28" fill="#1b4f9c" stroke="#1b4f9c" stroke-width="1.5" fill-opacity="0.10"/>
        <text x="440" y="161" text-anchor="middle" class="h ink">B</text>
        <text x="440" y="204" text-anchor="middle" class="h2 ink">neutral</text>
        <circle cx="760" cy="156" r="28" fill="#ffffff" stroke="#c7641a" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="760" y="161" text-anchor="middle" class="h ink">C</text>
        <text x="760" y="204" text-anchor="middle" class="h2 acc">positive</text>
        <path d="M212 232 V244 H468 V232" fill="none" stroke="#1b4f9c" stroke-width="1.5"/>
        <text x="340" y="268" text-anchor="middle" class="h2 navy">模型看得到這兩份</text>
        <path d="M760 232 V256" stroke="#c7641a" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>
        <text x="760" y="268" text-anchor="middle" class="h2 acc">藏起來</text>
        <text x="760" y="284" text-anchor="middle" class="n9 muted">只用來算答案</text>
        <path d="M340 276 V312" stroke="#6c798e" stroke-width="1.2" fill="none" marker-end="url(#annotation-reveal-setup-a1)"/>
        <path d="M760 292 V312" stroke="#6c798e" stroke-width="1.2" fill="none" marker-end="url(#annotation-reveal-setup-a1)"/>
        <rect x="200" y="320" width="280" height="72" rx="6" fill="#1b4f9c"/>
        <text x="340" y="352" text-anchor="middle" class="h inv">預測：這題會不會分歧？</text>
        <text x="340" y="372" text-anchor="middle" class="sub mono pale">輸出機率 → 排複核順序</text>
        <rect x="620" y="320" width="280" height="72" rx="6" fill="#ed9b26" stroke="#c7641a" stroke-width="1" fill-opacity="0.12"/>
        <text x="760" y="352" text-anchor="middle" class="h ink">真實答案：有分歧</text>
        <text x="760" y="372" text-anchor="middle" class="sub mono acc">neutral · neutral · positive</text>
        <rect x="80" y="420" width="840" height="56" rx="6" fill="#ffffff" stroke="#262e3d" stroke-width="1" stroke-opacity="0.12"/>
        <text x="104" y="444" class="h ink">前兩人一致，但第三人不同——這種題用「看前兩人吵不吵」的規則會判成安全。</text>
        <text x="104" y="464" class="q muted">佔全部題目的 66.5%，其中 24.4% 最後其實有分歧。這批就是本專案要抓的對象。</text>
      </svg>
