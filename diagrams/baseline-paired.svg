<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baseline-paired-title baseline-paired-desc" id="baseline-paired-root">
        <title id="baseline-paired-title">逐 seed 比較：小而穩的一步，和大而穩的一步</title>
        <desc id="baseline-paired-desc">三欄斜線圖：五個 reveal seed 上，同意標籤查表、TF-IDF Logistic Regression 與 BGE-M3 Logistic Regression 的 Recall@10%。第一段線幅度很小（配對差正 0.85 加減 0.26），第二段線明顯較陡（正 1.88 加減 0.88），兩段都是五個 seed 全勝。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #baseline-paired-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #baseline-paired-root { font-family: var(--font-sans); color: var(--color-ink); }
      #baseline-paired-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#baseline-paired-root .diagram-container { overflow-x: visible; }
}
      #baseline-paired-root text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #baseline-paired-root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #baseline-paired-root .h { font-size: 12px; font-weight: 700; }
      #baseline-paired-root .h2 { font-size: 11px; font-weight: 700; }
      #baseline-paired-root .q { font-size: 11px; }
      #baseline-paired-root .n9 { font-size: 9px; }
      #baseline-paired-root .lg { font-size: 8px; }
      #baseline-paired-root .sub { font-size: 9px; }
      #baseline-paired-root .val { font-size: 8px; }
      #baseline-paired-root .chip { font-size: 7px; }
      #baseline-paired-root .ink { fill: #262e3d; }
      #baseline-paired-root .muted { fill: #4f5b6e; }
      #baseline-paired-root .navy { fill: #1b4f9c; }
      #baseline-paired-root .acc { fill: #a04f15; }
      #baseline-paired-root .inv { fill: #ffffff; }
      #baseline-paired-root .pale { fill: #d6e4f5; }</style>
  </defs>
