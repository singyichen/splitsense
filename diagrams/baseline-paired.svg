        <text x="968" y="482" fill="#4f5b6e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">兩軸同尺度 17–21%，y 軸：Recall@10%</text>
        <text x="968" y="498" fill="#4f5b6e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">逐 seed 配對：同一 reveal seed 下兩方法的實測值</text>
