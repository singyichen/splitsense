<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baseline-paired-title baseline-paired-desc" id="baseline-paired-root">
        <title id="baseline-paired-title">逐 seed 比較：又小又穩</title>
        <desc id="baseline-paired-desc">斜線圖：五個 reveal seed 上，同意標籤查表與 Logistic Regression 的 Recall@10%。五條線全部向上但幅度都很小，配對差為正 0.85 加減 0.26，五個 seed 全勝。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #baseline-paired-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #baseline-paired-root { font-family: var(--font-sans); color: var(--color-ink); }
      #baseline-paired-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#baseline-paired-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>
