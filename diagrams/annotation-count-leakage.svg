<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="annotation-count-leakage-title annotation-count-leakage-desc" id="annotation-count-leakage-root">
        <title id="annotation-count-leakage-title">標註數本身就洩漏答案</title>
        <desc id="annotation-count-leakage-desc">長條圖：每題標註數 1 到 5 份對應的分歧率分別是 0.0%、30.7%、49.7%、88.1%、85.5%。本專案只取恰好 3 份的那一組，讓分母固定。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #annotation-count-leakage-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #annotation-count-leakage-root { font-family: var(--font-sans); color: var(--color-ink); }
      #annotation-count-leakage-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#annotation-count-leakage-root .diagram-container { overflow-x: visible; }
}
      #annotation-count-leakage-root text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #annotation-count-leakage-root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #annotation-count-leakage-root .h { font-size: 12px; font-weight: 700; }
      #annotation-count-leakage-root .h2 { font-size: 11px; font-weight: 700; }
      #annotation-count-leakage-root .q { font-size: 11px; }
      #annotation-count-leakage-root .n9 { font-size: 9px; }
      #annotation-count-leakage-root .lg { font-size: 8px; }
      #annotation-count-leakage-root .sub { font-size: 9px; }
      #annotation-count-leakage-root .val { font-size: 8px; }
      #annotation-count-leakage-root .chip { font-size: 7px; }
      #annotation-count-leakage-root .ink { fill: #262e3d; }
      #annotation-count-leakage-root .muted { fill: #4f5b6e; }
      #annotation-count-leakage-root .navy { fill: #1b4f9c; }
      #annotation-count-leakage-root .acc { fill: #a04f15; }
      #annotation-count-leakage-root .inv { fill: #ffffff; }
      #annotation-count-leakage-root .pale { fill: #d6e4f5; }</style>
  </defs>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <line x1="80" y1="420" x2="960" y2="420" stroke="#262e3d" stroke-width="1" stroke-opacity="0.25"/>
        <text x="72" y="423" text-anchor="end" class="val mono muted">0%</text>
        <line x1="80" y1="325" x2="960" y2="325" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="328" text-anchor="end" class="val mono muted">25%</text>
        <line x1="80" y1="230" x2="960" y2="230" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="233" text-anchor="end" class="val mono muted">50%</text>
        <line x1="80" y1="135" x2="960" y2="135" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="138" text-anchor="end" class="val mono muted">75%</text>
        <line x1="80" y1="40" x2="960" y2="40" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="72" y="43" text-anchor="end" class="val mono muted">100%</text>
        <line x1="80" y1="40" x2="80" y2="420" stroke="#262e3d" stroke-width="1" stroke-opacity="0.25"/>
        <text x="168" y="412" text-anchor="middle" class="val mono muted">0.0%</text>
        <text x="168" y="444" text-anchor="middle" class="h2 ink">1 份</text>
        <text x="168" y="460" text-anchor="middle" class="val mono muted">1,877</text>
        <rect x="288" y="303" width="112" height="117" fill="#ffffff"/>
        <rect x="288" y="303" width="112" height="117" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="344" y="295" text-anchor="middle" class="val mono muted">30.7%</text>
        <text x="344" y="444" text-anchor="middle" class="h2 ink">2 份</text>
        <text x="344" y="460" text-anchor="middle" class="val mono muted">6,103</text>
        <rect x="464" y="231" width="112" height="189" fill="#ffffff"/>
        <rect x="464" y="231" width="112" height="189" fill="#ed9b26" stroke="#c7641a" stroke-width="1" fill-opacity="0.12"/>
        <text x="520" y="223" text-anchor="middle" class="val mono acc">49.7%</text>
        <text x="520" y="444" text-anchor="middle" class="h2 ink">3 份</text>
        <text x="520" y="460" text-anchor="middle" class="val mono muted">31,766</text>
        <rect x="640" y="85" width="112" height="335" fill="#ffffff"/>
        <rect x="640" y="85" width="112" height="335" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="696" y="77" text-anchor="middle" class="val mono muted">88.1%</text>
        <text x="696" y="444" text-anchor="middle" class="h2 ink">4 份</text>
        <text x="696" y="460" text-anchor="middle" class="val mono muted">5,533</text>
        <rect x="816" y="95" width="112" height="325" fill="#ffffff"/>
        <rect x="816" y="95" width="112" height="325" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="872" y="87" text-anchor="middle" class="val mono muted">85.5%</text>
        <text x="872" y="444" text-anchor="middle" class="h2 ink">5 份</text>
        <text x="872" y="460" text-anchor="middle" class="val mono muted">12,424</text>
        <line x1="32" y1="488" x2="968" y2="488" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="32" y="512" letter-spacing="0.14em" class="val mono muted">LEGEND</text>
        <rect x="128" y="502" width="16" height="10" rx="2" fill="#ed9b26" stroke="#c7641a" stroke-width="1" fill-opacity="0.12"/>
        <text x="152" y="512" class="lg muted">本專案只用這一組</text>
        <rect x="312" y="502" width="16" height="10" rx="2" fill="#4f5b6e" stroke="#6c798e" stroke-width="1" fill-opacity="0.15"/>
        <text x="336" y="512" class="lg muted">排除</text>
        <text x="968" y="512" text-anchor="end" class="val mono muted">y 軸：該組 item 的分歧率</text>
      </svg>
