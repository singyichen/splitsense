<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="annotation-count-leakage-title annotation-count-leakage-desc" id="annotation-count-leakage-root">
        <title id="annotation-count-leakage-title">標註數本身就洩漏答案</title>
        <desc id="annotation-count-leakage-desc">長條圖：每題標註數 1 到 5 份對應的分歧率分別是 0.0%、30.7%、49.7%、88.1%、85.5%。本專案只取恰好 3 份的那一組，讓分母固定。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #annotation-count-leakage-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #annotation-count-leakage-root { font-family: var(--font-sans); color: var(--color-ink); }
      #annotation-count-leakage-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#annotation-count-leakage-root .diagram-container { overflow-x: visible; }
}</style>
