<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metric-saturation-title metric-saturation-desc" id="metric-saturation-root">
        <title id="metric-saturation-title">為什麼主要指標會飽和</title>
        <desc id="metric-saturation-desc">比例圖：測試集 4,741 題中，1,588 題（33.5%）可見標註已不一致、必然有分歧，其餘 3,153 題可見一致。10% 預算的 474 個名額完全落在前者，所以任何方法的 Precision 都是 100%。</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #metric-saturation-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #metric-saturation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #metric-saturation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#metric-saturation-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>
        <rect width="100%" height="100%" fill="#f6f8fb"/>
        <rect x="80" y="176" width="295" height="88" fill="#ed9b26" fill-opacity="0.12"/>
        <rect x="375" y="176" width="585" height="88" fill="#1b4f9c" fill-opacity="0.10"/>
        <rect x="80" y="176" width="880" height="88" fill="none" stroke="#262e3d" stroke-width="1" stroke-opacity="0.25"/>
        <line x1="375" y1="176" x2="375" y2="264" stroke="#c7641a" stroke-width="1.5"/>
        <text x="227" y="212" fill="#262e3d" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">可見已不一致</text>
        <text x="227" y="232" fill="#a04f15" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1,588 · 33.5% · 100% 分歧</text>
        <text x="667" y="212" fill="#262e3d" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">可見一致（難題組）</text>
        <text x="667" y="232" fill="#1b4f9c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3,153 · 66.5% · 24.7% 分歧</text>
        <path d="M80 148 V136 H168 V148" fill="none" stroke="#1b4f9c" stroke-width="1.5"/>
        <rect x="72" y="108" width="160" height="16" rx="2" fill="#f6f8fb"/>
        <text x="80" y="120" fill="#1b4f9c" font-size="9" font-family="'Geist Mono', monospace">預算 10% · K=474</text>
        <path d="M375 264 V280" stroke="#c7641a" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="375" y="296" fill="#a04f15" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">33.5%</text>
        <text x="375" y="312" fill="#4f5b6e" font-size="8" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">預算要超過這裡，Precision 才會開始下降</text>
        <rect x="80" y="340" width="880" height="72" rx="6" fill="#ffffff" stroke="#262e3d" stroke-width="1" stroke-opacity="0.12"/>
        <text x="104" y="372" fill="#262e3d" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif">確定會吵的有 1,588 題，10% 預算的名額只有 474 個。</text>
        <text x="104" y="394" fill="#4f5b6e" font-size="11" font-family="'Geist', 'Noto Sans TC', sans-serif">所以任何方法只要把這批排前面，Precision@10% 都是 100%、Recall@10% 都卡在上限 20.1%——指標分不出模型好壞。</text>
        <line x1="32" y1="452" x2="968" y2="452" stroke="#262e3d" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="32" y="476" fill="#4f5b6e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="466" width="16" height="10" rx="2" fill="#ed9b26" stroke="#c7641a" stroke-width="1" fill-opacity="0.12"/>
        <text x="152" y="476" fill="#4f5b6e" font-size="8" font-family="'Geist', 'Noto Sans TC', sans-serif">必然分歧，不需要模型</text>
        <rect x="344" y="466" width="16" height="10" rx="2" fill="#1b4f9c" stroke="#1b4f9c" stroke-width="1" fill-opacity="0.12"/>
        <text x="368" y="476" fill="#4f5b6e" font-size="8" font-family="'Geist', 'Noto Sans TC', sans-serif">模型真正要解的那批</text>
        <text x="968" y="476" fill="#4f5b6e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">test split 4,741 題</text>
      </svg>
