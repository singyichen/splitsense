<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逐 seed 比較：又小又穩</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --color-accent:  #a04f15;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; height: auto; max-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Slopegraph · SplitSense</p>
    <h1>逐 seed 比較：又小又穩</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 540" width="2000" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="baseline-paired-title baseline-paired-desc">
        <title id="baseline-paired-title">逐 seed 比較：又小又穩</title>
        <desc id="baseline-paired-desc">斜線圖：五個 reveal seed 上，同意標籤查表與 Logistic Regression 的 Recall@10%。五條線全部向上但幅度都很小，配對差為正 0.85 加減 0.26，五個 seed 全勝。</desc>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 12px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .n9   { font-size: 9px; }
          .lg   { font-size: 8px; }
          .sub  { font-size: 9px; }
          .val  { font-size: 8px; }
          .chip { font-size: 7px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
          .pale  { fill: #d6e4f5; }
        </style>
        <rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
        <line x1="320" y1="40" x2="320" y2="420" stroke="rgba(38,46,61,0.25)" stroke-width="1"/>
        <line x1="680" y1="40" x2="680" y2="420" stroke="rgba(38,46,61,0.25)" stroke-width="1"/>
        <line x1="320" y1="341" x2="680" y2="268" stroke="rgba(38,46,61,0.665)" stroke-width="1.2"/>
        <line x1="320" y1="234" x2="680" y2="162" stroke="rgba(38,46,61,0.755)" stroke-width="1.2"/>
        <line x1="320" y1="191" x2="680" y2="82" stroke="rgba(38,46,61,0.8)" stroke-width="1.2"/>
        <line x1="320" y1="345" x2="680" y2="245" stroke="rgba(38,46,61,0.62)" stroke-width="1.2"/>
        <line x1="320" y1="241" x2="680" y2="193" stroke="rgba(38,46,61,0.71)" stroke-width="1.2"/>
        <circle cx="320" cy="341" r="3" fill="rgba(38,46,61,0.665)"/>
        <circle cx="680" cy="268" r="3" fill="rgba(38,46,61,0.665)"/>
        <text x="304" y="341" text-anchor="end" class="val mono muted">17.83</text>
        <text x="696" y="271" class="val mono muted">18.60</text>
        <text x="728" y="271" class="h2 ink">seed 0</text>
        <circle cx="320" cy="234" r="3" fill="rgba(38,46,61,0.755)"/>
        <circle cx="680" cy="162" r="3" fill="rgba(38,46,61,0.755)"/>
        <text x="304" y="234" text-anchor="end" class="val mono muted">18.96</text>
        <text x="696" y="165" class="val mono muted">19.72</text>
        <text x="728" y="165" class="h2 ink">seed 1</text>
        <circle cx="320" cy="191" r="3" fill="rgba(38,46,61,0.8)"/>
        <circle cx="680" cy="82" r="3" fill="rgba(38,46,61,0.8)"/>
        <text x="304" y="194" text-anchor="end" class="val mono muted">19.41</text>
        <text x="696" y="85" class="val mono muted">20.56</text>
        <text x="728" y="85" class="h2 ink">seed 2</text>
        <circle cx="320" cy="345" r="3" fill="rgba(38,46,61,0.62)"/>
        <circle cx="680" cy="245" r="3" fill="rgba(38,46,61,0.62)"/>
        <text x="304" y="351" text-anchor="end" class="val mono muted">17.79</text>
        <text x="696" y="248" class="val mono muted">18.84</text>
        <text x="728" y="248" class="h2 ink">seed 3</text>
        <circle cx="320" cy="241" r="3" fill="rgba(38,46,61,0.71)"/>
        <circle cx="680" cy="193" r="3" fill="rgba(38,46,61,0.71)"/>
        <text x="304" y="247" text-anchor="end" class="val mono muted">18.88</text>
        <text x="696" y="196" class="val mono muted">19.39</text>
        <text x="728" y="196" class="h2 ink">seed 4</text>
        <text x="320" y="440" text-anchor="middle" letter-spacing="0.14em" class="sub mono muted">同意標籤查表</text>
        <text x="680" y="440" text-anchor="middle" letter-spacing="0.14em" class="sub mono muted">LOGISTIC REGRESSION</text>
        <rect x="40" y="96" width="232" height="76" rx="6" fill="#ffffff" stroke="rgba(38,46,61,0.12)" stroke-width="1"/>
        <text x="60" y="124" class="h ink">配對差 +0.85 ± 0.26</text>
        <text x="60" y="144" class="h2 navy">5 個 seed 全勝</text>
        <text x="60" y="162" class="n9 muted">各自標準差都是 ±0.8</text>
        <line x1="32" y1="462" x2="968" y2="462" stroke="rgba(38,46,61,0.12)" stroke-width="0.8"/>
        <text x="32" y="482" letter-spacing="0.14em" class="val mono muted">LEGEND</text>
        <line x1="128" y1="478" x2="152" y2="478" stroke="rgba(38,46,61,0.80)" stroke-width="1.2"/>
        <circle cx="140" cy="478" r="3" fill="rgba(38,46,61,0.80)"/>
        <text x="164" y="482" class="lg muted">一個 reveal seed；色階最強者左端值最高</text>
        <text x="968" y="482" text-anchor="end" class="val mono muted">兩軸同尺度 17–21%，y 軸：Recall@10%</text>
        <text x="968" y="498" text-anchor="end" class="val mono muted">逐 seed 配對：同一 reveal seed 下兩方法的實測值</text>
      </svg>
    </div>
  </div>
</body>
</html>
