<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 900" width="2000" height="1800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-pipeline-title module-pipeline-desc" id="module-pipeline-root">
        <title id="module-pipeline-title">從上游資料到產物</title>
        <desc id="module-pipeline-desc">分層架構圖。左側由上而下：外部來源 HuggingFace TID-8，接著四層——取得資料、資料協議、特徵、模型與分析，每層標出負責的模組、要跑的腳本與不得違反的不變量。右側是貫穿全圖的儲存層，每一層以虛線對應它寫出的目錄：data/raw、artifacts 的 eda、manifests、embeddings，以及 baselines、models、error_analysis。底部兩列：六支腳本的執行順序，以及被四層共用的 config.py 與 metrics.py。</desc>
        <style>
          text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
          .h    { font-size: 13px; font-weight: 700; }
          .h2   { font-size: 11px; font-weight: 700; }
          .q    { font-size: 11px; }
          .sub  { font-size: 9px; }
          .lg   { font-size: 8px; }
          .val  { font-size: 8px; }
          .ink   { fill: #262e3d; }
          .muted { fill: #4f5b6e; }
          .soft  { fill: #9aa6b8; }
          .navy  { fill: #1b4f9c; }
          .acc   { fill: #a04f15; }
          .inv   { fill: #ffffff; }
        </style>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #module-pipeline-root { --color-paper:   #f6f8fb;
      --color-ink:     #262e3d;
      --color-muted:   #4f5b6e;
      --font-sans:     'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif:    'Noto Serif TC', serif;
      --font-mono:     ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #module-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #module-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#module-pipeline-root .diagram-container { overflow-x: visible; }
}
      #module-pipeline-root text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
      #module-pipeline-root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #module-pipeline-root .h { font-size: 13px; font-weight: 700; }
      #module-pipeline-root .h2 { font-size: 11px; font-weight: 700; }
      #module-pipeline-root .q { font-size: 11px; }
      #module-pipeline-root .sub { font-size: 9px; }
      #module-pipeline-root .lg { font-size: 8px; }
      #module-pipeline-root .val { font-size: 8px; }
      #module-pipeline-root .ink { fill: #262e3d; }
      #module-pipeline-root .muted { fill: #4f5b6e; }
      #module-pipeline-root .soft { fill: #9aa6b8; }
      #module-pipeline-root .navy { fill: #1b4f9c; }
      #module-pipeline-root .acc { fill: #a04f15; }
      #module-pipeline-root .inv { fill: #ffffff; }</style>
